version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: finguard-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-finguard_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard_admin -d finguard_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finguard-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finguard_admin}:${POSTGRES_PASSWORD:-finguard_secure_password_2026}@db:5432/${POSTGRES_DB:-finguard_prod}
    volumes:
      - storage_data:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finguard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  storage_data:
